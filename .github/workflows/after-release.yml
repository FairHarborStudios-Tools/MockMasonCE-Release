name: after-release

# Runs after the build pipeline publishes a release here (it sends a "release-published" signal).
# Keeps only the newest ten development builds per system, then points the README download
# buttons at the newest installers. Finished releases are never pruned.
# It can also be run by hand from the Actions tab.

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep the newest ten development builds per system
        run: |
          for prefix in windows- macos-; do
            gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName,isPrerelease,createdAt \
              --jq "[.[] | select(.isPrerelease and (.tagName | startswith(\"$prefix\")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName" |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
          done
      - name: Remove releases from before Windows and macOS were published separately
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName --jq '.[].tagName | select(startswith("v"))' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
      - name: Point the README buttons at the newest installers
        run: |
          python3 .github/scripts/update-readme.py
          if ! git diff --quiet; then
            git config user.name "GregoryLeJeune"
            git config user.email "45644514+gregorylejeune@users.noreply.github.com"
            git commit -q -am "Update download links"
            git push origin main
          fi
