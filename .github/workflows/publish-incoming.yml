name: publish-incoming

# Turns a pushed "incoming/<tag>" branch into a release, then removes the branch.
# Tags are per system: windows-v1.2.0 or macos-v1.2.0 (a "-dev.N" ending marks a development build).
# The branch holds the installer files in files/ and the release notes in notes.md.
# Afterwards the README download buttons are pointed at the newest installers, and only the
# newest ten development builds per system are kept. Finished releases are never pruned.

on:
  push:
    branches: ['incoming/**']

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        run: |
          TAG="${BRANCH#incoming/}"
          case "$TAG" in
            windows-v[0-9]*) SYSTEM="Windows"; VERSION="${TAG#windows-v}";;
            macos-v[0-9]*) SYSTEM="macOS"; VERSION="${TAG#macos-v}";;
            *) echo "Unexpected tag: $TAG"; exit 1;;
          esac
          FLAGS=()
          case "$VERSION" in *-*) FLAGS+=(--prerelease);; esac
          gh release create "$TAG" --target main --title "MockMason $VERSION for $SYSTEM" \
            --notes-file notes.md "${FLAGS[@]}" files/*
          git push origin --delete "$BRANCH"
      - name: Keep the newest ten development builds per system
        run: |
          for prefix in windows- macos-; do
            gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName,isPrerelease,createdAt \
              --jq "[.[] | select(.isPrerelease and (.tagName | startswith(\"$prefix\")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName" |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
          done
      - name: Point the README buttons at the newest installers
        run: |
          git fetch --depth 1 origin main
          git checkout -f -B main origin/main
          python3 .github/scripts/update-readme.py
          if ! git diff --quiet; then
            git config user.name "GregoryLeJeune"
            git config user.email "45644514+gregorylejeune@users.noreply.github.com"
            git commit -q -am "Update download links"
            git push origin main
          fi
