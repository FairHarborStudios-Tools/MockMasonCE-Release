name: publish-incoming

# Turns a pushed "incoming/<tag>" branch into a release, then removes the branch.
# The branch holds the installer files in files/ and the release notes in notes.md.
# Afterwards only the newest ten development builds are kept. Finished releases are never pruned.

on:
  push:
    branches: ['incoming/**']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="${BRANCH#incoming/}"
          case "$TAG" in v[0-9]*) ;; *) echo "Unexpected tag: $TAG"; exit 1;; esac
          FLAGS=()
          case "$TAG" in *-*) FLAGS+=(--prerelease);; esac
          gh release create "$TAG" --target main --title "MockMason ${TAG#v}" \
            --notes-file notes.md "${FLAGS[@]}" files/*
          git push origin --delete "$BRANCH"
      - name: Keep the newest ten development builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
